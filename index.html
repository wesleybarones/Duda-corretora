  <head>
    <meta charset="UTF-8" />

    <title>Duda Corretora | Venda seu imóvel em Niterói</title>
    <meta name="description" content="Quer vender seu imóvel em Niterói? Eu gravo vídeos verdadeiros do seu imóvel, divulgo em uma das maiores vitrines digitais da cidade, filtro os interessados e cuido da burocracia. Sem exclusividade." />
    <meta name="theme-color" content="#0E3B43" />
    <script>
      (function () {
        var r = document.documentElement, t, l;
        try { t = localStorage.getItem('duda-tema'); l = localStorage.getItem('duda-lang'); } catch (e) {}
        if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
        var q = new URLSearchParams(location.search).get('lang');
        if (q === 'en' || q === 'pt') l = q;
        if (l !== 'en') l = 'pt';
        r.dataset.theme = t; r.dataset.lang = l; r.lang = l === 'en' ? 'en' : 'pt-BR';
        if (t === 'night') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0B1E23');
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://duda-corretora.vercel.app/" />
    <meta property="og:title" content="Duda Corretora | Seu imóvel merece ser visto, não só anunciado" />
    <meta property="og:description" content="Vídeos verdadeiros, grande visibilidade e visitas de quem realmente quer comprar. Venda seu imóvel em Niterói sem perder tempo e sem burocracia." />
